<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rialo Petverse</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- decorative background layer (logo-shape motif, mirrored / rotated / recolored) -->
  <div class="deco-layer" aria-hidden="true">
    <svg class="deco deco-1" viewBox="0 0 100 100"><use href="#logoShape"/></svg>
    <svg class="deco deco-2" viewBox="0 0 100 100"><use href="#logoShape"/></svg>
    <svg class="deco deco-3" viewBox="0 0 100 100"><use href="#logoShape"/></svg>
    <svg class="deco deco-4" viewBox="0 0 100 100"><use href="#logoShape"/></svg>
    <svg class="deco deco-5" viewBox="0 0 100 100"><use href="#logoShape"/></svg>
  </div>

  <!-- shared shape definition, reused everywhere via <use> -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <path id="logoShape" d="M35,10 C55,10 55,25 40,30 C25,35 25,45 45,45 L70,45 C85,45 85,60 70,60 C60,60 55,65 55,80 L55,90 C55,95 50,100 45,100 C40,100 35,95 35,90 L35,60 C20,60 15,50 15,40 C15,25 20,10 35,10 Z"/>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 100 100"><use href="#logoShape"/></svg>
      <span class="brand-name">Rialo <strong>Petverse</strong></span>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" class="lang-btn active" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="tr">TR</button>
    </div>
  </header>

  <div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <button id="connectWalletBtn" class="side-btn primary">
        <span class="icon">🔗</span>
        <span data-i18n="connectWallet">Connect Wallet</span>
      </button>

      <button id="createProfileBtn" class="side-btn">
        <span class="icon">👤</span>
        <span data-i18n="createProfile">Create Profile</span>
      </button>

      <button id="addTokenBtn" class="side-btn">
        <span class="icon">🪙</span>
        <span data-i18n="addToken">Add Rialo Token</span>
      </button>

      <div id="walletStatus" class="wallet-status" data-i18n="notConnected">Not connected</div>

      <!-- transition / slideshow screen, right below the sidebar buttons -->
      <div class="pet-carousel" id="petCarousel">
        <div class="pet-carousel-frame">
          <div class="pet-slide active" id="petSlide"></div>
        </div>
        <div class="pet-carousel-dots" id="petDots"></div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <section class="hero">
        <h1 data-i18n="heroTitle">Welcome to Rialo Petverse</h1>
        <p data-i18n="heroSubtitle">Connect your wallet, create your profile, and get ready to build your pet's on-chain passport.</p>
        <div class="hero-note" data-i18n="heroComingSoon">
          Coming next: NFT pet passport (microchip, vet records, vaccinations, insurance) and Sepolia ↔ Rialo token swap.
        </div>
      </section>
    </main>
  </div>

  <!-- PROFILE MODAL -->
  <div class="modal-overlay" id="profileModalOverlay">
    <div class="modal">
      <h2 data-i18n="profileModalTitle">Create Your Profile</h2>
      <label data-i18n="profileNameLabel">Display name</label>
      <input type="text" id="profileNameInput" data-i18n-placeholder="profileNamePlaceholder" placeholder="e.g. Ayşe" />
      <label data-i18n="profileAvatarLabel">Choose an avatar</label>
      <div class="avatar-picker" id="avatarPicker"></div>
      <div class="modal-actions">
        <button class="side-btn" id="profileCancelBtn" data-i18n="cancel">Cancel</button>
        <button class="side-btn primary" id="profileSaveBtn" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/pets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
